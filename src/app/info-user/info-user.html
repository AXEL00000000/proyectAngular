<!-- top-bar.component.html -->
<mat-toolbar class="top-bar">
  <span class="spacer"></span>
  
  <div class="user-menu">
    <button mat-button [matMenuTriggerFor]="userMenu" (click)="toggleMenu()">
      <span class="user-name">{{ currentUser?.name || 'Usuario' }}</span>
      <mat-icon>{{ isMenuOpen ? 'arrow_drop_up' : 'arrow_drop_down' }}</mat-icon>
    </button>
    
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="navigateToProfile()">
        <mat-icon>account_circle</mat-icon>
        <span>Ver perfil</span>
      </button>
      <!-- Corrección: agregado (click)="logout()" -->
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
